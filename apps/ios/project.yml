name: Chess
options:
  bundleIdPrefix: com.workgyver
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    DEVELOPMENT_TEAM: KBPJG8WNLV
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  ChessKit:
    url: https://github.com/chesskit-app/chesskit-swift
    from: 0.17.0
  ChessKitEngine:
    url: https://github.com/chesskit-app/chesskit-engine
    from: 0.7.0
  Vortex:
    url: https://github.com/twostraws/Vortex
    from: 1.0.4

targets:
  Chess:
    type: application
    platform: iOS
    sources:
      # Chess/NNUE/*.nnue (tools/fetch-nnue.sh) land at the bundle's root, where ChessKitEngine looks.
      - path: Chess
    entitlements:
      path: Chess/Chess.entitlements
      properties:
        com.apple.developer.game-center: true
    dependencies:
      - package: ChessKit
      - package: ChessKitEngine
      - package: Vortex
    info:
      path: Chess/Info.plist
      properties:
        CFBundleDisplayName: Chess
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Portrait only, so iOS must not offer it in Split View or Slide Over.
        UIRequiresFullScreen: true
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.workgyver.chess
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Night AppIcon-Mono"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
